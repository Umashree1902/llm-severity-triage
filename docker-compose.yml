# Assistant + local LLM server. First run: docker compose up -d && docker compose exec ollama ollama pull llama3.1:8b
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
  triage:
    build: .
    ports: ["8000:8000"]
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.1:8b
      OLLAMA_URL: http://ollama:11434
    volumes: [triage-data:/srv/data]
    depends_on: [ollama]
volumes:
  ollama: {}
  triage-data: {}
